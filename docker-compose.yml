services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexaops
      POSTGRES_PASSWORD: nexaops
      POSTGRES_DB: nexaops
    ports:
      # Host port remapped to 55432: this machine already runs a native
      # Postgres on 127.0.0.1:5432/::1:5432 (Postgres.app or similar) that
      # wins the loopback race against Docker's mapping. Only affects
      # host-side tools (migrations, `npm run dev` outside Docker) —
      # container-to-container traffic always uses the internal 5432.
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaops -d nexaops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Host port remapped to 56379: this machine already runs a native
      # Redis on 127.0.0.1:6379/::1:6379 — same reasoning as postgres above.
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: nexaops
      RABBITMQ_DEFAULT_PASS: nexaops
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_APP_URL: postgresql://nexaops_app:${DB_APP_PASSWORD}@postgres:5432/nexaops
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://nexaops:nexaops@rabbitmq:5672
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: infra/docker/ai-service.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_APP_URL: postgresql://nexaops_app:${DB_APP_PASSWORD}@postgres:5432/nexaops
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  document-worker:
    build:
      context: .
      dockerfile: infra/docker/document-worker.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_APP_URL: postgresql://nexaops_app:${DB_APP_PASSWORD}@postgres:5432/nexaops
      RABBITMQ_URL: amqp://nexaops:nexaops@rabbitmq:5672
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mock-business:
    build:
      context: .
      dockerfile: infra/docker/mock-business.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "4200:4200"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
